name: Deploy

on:

  push:
    branches:
      - feature/test1

  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  

jobs:
  build-and-push:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:dev
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:dev
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "chmod completed successfully"
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts


      - name: Copy compose file and nginx config
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.dev.yml ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/var/www/test-full-flow/docker-compose.dev.yml
          echo "copy file is completed"
          scp -i ~/.ssh/id_rsa -r nginx ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/var/www/test-full-flow/


      - name: Deploy to dev EC2
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "
            set -e
            cd /var/www/test-full-flow
            echo '=== Diagnostic: Check what is using port 80 ==='
            (netstat -tlnp 2>/dev/null | grep :80 || echo 'No process found via netstat') || true
            echo '=== Stopping old containers ==='
            docker compose -f docker-compose.dev.yml down 2>/dev/null || true
            echo '=== Removing all stopped containers ==='
            docker container prune -af 2>/dev/null || true
            echo '=== Removing all networks ==='
            docker network prune -af 2>/dev/null || true
            echo '=== Killing any lingering container processes ==='
            docker ps -aq 2>/dev/null | xargs -r docker kill 2>/dev/null || true
            echo '=== Removing all containers ==='
            docker ps -aq 2>/dev/null | xargs -r docker rm -f 2>/dev/null || true
            echo '=== Waiting 5 seconds for port release ==='
            sleep 5
            echo '=== Restarting Docker daemon ==='
            sudo systemctl restart docker 2>/dev/null || systemctl restart docker 2>/dev/null || service docker restart 2>/dev/null || true
            sleep 5
            echo '=== Verifying Docker is running ==='
            docker ps || echo 'Docker still starting...'
            sleep 2
            echo '=== Logging in to GHCR ==='
            echo '${{ secrets.PAT_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo '=== Starting fresh containers ==='
            docker compose -f docker-compose.dev.yml up -d --pull always
            echo '=== Deployment complete - checking container status ==='
            docker ps
          "